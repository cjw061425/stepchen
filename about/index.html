我有眼泪给别人，但不愿<br>
为自己痛哭；我没有使自己<br>
适合于这世界，也没有美丽的<br>
自辟的国土，就只好永远<br>
渴望：为希望而生；在希望里<br>
死去，终于承认了不知道<br>
生命；接受了它又挥霍掉，<br>
只是历史的工具，长路上的<br>
一粒沙，所以拼命摆脱<br>
那黑影，而他们因此讥笑我；<br>
这就选择了寂寞，热闹的寂寞<br>
用笑声骗自己，飘浮在庸俗<br>
生活的涡流里，而渐渐我就说<br>
我是个庸俗主义者，无心痛哭
</p>
